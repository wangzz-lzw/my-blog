services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blog_password}
      POSTGRES_DB: blog
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # 服务器上的 .env 直接注入容器（OSS / AI / 管理员等所有变量）
    env_file:
      - .env
    environment:
      # 容器内数据库地址覆盖 .env 里的 localhost 配置
      DATABASE_URL: postgresql://blog:${POSTGRES_PASSWORD:-blog_password}@db:5432/blog?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?请先在 .env 设置 AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-http://localhost}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请先在 .env 设置 ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
