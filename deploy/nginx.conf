# 部署示例：/etc/nginx/conf.d/my-blog.conf
# 用法：把 server_name 改成你的域名（没有域名就保留 _ 用 IP 访问），再 nginx -s reload

# WebSocket / HMR 用的连接头映射（写死 Connection: upgrade 会破坏 keepalive）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;                # ← 有域名就改成 your-domain.com

    # 图片上传上限：应用限制 5MB，这里留余量
    client_max_body_size 10m;

    # 静态资源与页面压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # Next.js 带 hash 的静态资源可长期缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}