name: CI / CD

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  # ---------- CI：类型与依赖检查 ----------
  ci:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成 Prisma Client
        run: npx prisma generate

      - name: TypeScript 类型检查
        run: npx tsc --noEmit

  # ---------- CD：服务器拉取 + Docker 重建 ----------
  deploy:
    name: 部署到服务器
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Secrets 自检（不打印敏感值）
        env:
          HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          KEY: ${{ secrets.SSH_KEY }}
          PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          echo "SSH_HOST 长度: ${#HOST}"
          echo "SSH_USER: ${SSH_USER:-<空>}"
          echo "SSH_PORT: ${PORT:-<空，默认 22>}"
          echo "DEPLOY_PATH: ${DEPLOY_PATH:-<空>}"
          echo "SSH_KEY 长度: ${#KEY}"
          echo "SSH_KEY 行数: $(printf '%s' "$KEY" | wc -l)"
          echo "SSH_KEY 含 BEGIN: $(printf '%s' "$KEY" | grep -c 'BEGIN OPENSSH PRIVATE KEY' || true)"
          echo "SSH_KEY 含 CRLF: $(printf '%s' "$KEY" | tr -cd '\r' | wc -c)"

          if [ "${SSH_USER}" = "root" ]; then
            echo "::: 使用 root 部署：公钥在 /root/.ssh/authorized_keys"
            echo "::: 注意：若部署目录曾由其他用户创建，git 会因 safe.directory 拒绝操作（脚本内已自动处理）"
          fi

      - name: 网络连通性检查
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          set -uo pipefail
          echo "目标: ${SSH_HOST}:${SSH_PORT}"
          echo "⚠️ SSH_HOST 必须是公网 IP（华为云控制台里的『公网IP』），不能是 172.x/10.x 内网 IP 或主机名"

          if getent hosts "$SSH_HOST" >/dev/null 2>&1; then
            echo "DNS 解析: $(getent hosts "$SSH_HOST" | awk '{print $1}' | head -1)"
          else
            echo "❌ 无法解析主机名（请填公网 IP，别填 hcss-ecs-xxx 这类主机名）"
          fi

          if timeout 8 bash -c "</dev/tcp/${SSH_HOST}/${SSH_PORT}" 2>/dev/null; then
            echo "✅ TCP ${SSH_PORT} 可达"
          else
            echo "❌ TCP ${SSH_PORT} 不通：检查公网 IP、安全组、服务器防火墙(ufw/firewalld)"
          fi

      - name: 准备私钥（自动去 CRLF）
        env:
          KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          ssh-keygen -l -f ~/.ssh/authorized_keys || (echo "私钥解析失败：请重新粘贴完整私钥" && exit 1)

      - name: SSH 部署（拉代码 + docker compose 重建）
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_BRANCH: master
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/authorized_keys -p "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            "${SSH_USER}@${SSH_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' DEPLOY_BRANCH='${DEPLOY_BRANCH}' bash -s" <<'REMOTE'
          set -euo pipefail

          echo "当前用户: $(whoami)  HOME: $HOME"
          echo "SSH 公钥目录: $HOME/.ssh/authorized_keys"

          if [ ! -d "$DEPLOY_PATH" ]; then
            echo "❌ 部署目录不存在: $DEPLOY_PATH"
            echo "候选目录："
            ls -d "$HOME/opt/my-blog" /opt/my-blog /root/opt/my-blog /home/*/opt/my-blog 2>/dev/null || true
            echo "→ 请把 GitHub Secret 的 DEPLOY_PATH 改成实际路径"
            exit 1
          fi

          cd "$DEPLOY_PATH"

          # 以 root 部署时，若仓库目录属于其他用户（例如之前用 deploy 用户拉过代码），
          # git 2.35+ 会报 "detected dubious ownership" 并拒绝所有操作。
          # 这里把部署目录登记到 safe.directory（幂等，重复执行不会产生重复项）。
          git config --global --add safe.directory "$DEPLOY_PATH" </dev/null 2>/dev/null || true

          echo "==> 拉取最新代码"
          git fetch --prune origin
          git checkout -B "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
          git reset --hard "origin/$DEPLOY_BRANCH"

          echo "==> 重建并启动容器（迁移与 seed 在容器启动时自动执行）"
          docker compose up -d --build --remove-orphans
          docker image prune -f >/dev/null 2>&1 || true

          echo "==> 健康检查"
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:3000/api/auth/session" >/dev/null; then
              echo "健康检查通过 ✅"
              exit 0
            fi
            sleep 3
          done

          echo "健康检查失败，输出 app 容器日志："
          docker compose logs --tail=100 app
          exit 1
          REMOTE
